<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hirruuuuu ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="particles"></div>

<!-- ================= SCREEN 1 ================= -->

<section id="screen1" class="screen active">

<div class="intro">

<h2>❤️ Raj has something to say...</h2>

<div id="envelope" class="envelope">

<div class="flap"></div>

<div class="body"></div>

<div class="letter"></div>

</div>

<h1>A Letter For Hirruuuuu 💌</h1>

<button id="openBtn">

Open My Heart ❤️

</button>

</div>

</section>

<!-- ================= SCREEN 2 ================= -->

<section id="screen2" class="screen">

<div class="paper">

<div class="photoFrame">

<img
src="IMG-20260730-WA0000.jpg"
id="photo">

</div>

<h1 class="title">

For My Hirruuuuu ❤️

</h1>

<div id="messageBox">

<p id="message"></p>

</div>

<div class="progress">

<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

<button id="nextBtn">

Next ❤️

</button>

</div>

</section>
<!-- ================= SCREEN 3 ================= -->

<section id="screen3" class="screen">

<div class="questionCard">

<h1>Will you forgive me? 🥺</h1>

<div class="buttons">

<button id="yesBtn">
🥹 Yes ❤️
</button>

<button id="noBtn">
🥺 No
</button>

</div>

</div>

</section>

<!-- ================= SCREEN 4 ================= -->

<section id="screen4" class="screen">

<div id="celebration">

<div id="rain"></div>

<h1 id="finalText">

Thank you for forgiving me,<br>

Hirruuuuu ❤️

</h1>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
