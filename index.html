<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hirruuuuu ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>


<body>


<div class="petals"></div>


<!-- Screen 1 -->

<div class="screen welcome" id="welcome">

<div class="envelope">
💌
</div>


<h1>
For My Hirruuuuu ❤️
</h1>


<p>
Raj has a little apology from his heart...
</p>


<button onclick="openLetter()">
Open My Letter 💌
</button>


</div>




<!-- Screen 2 & 3 -->

<div class="screen letter" id="letter">


<img src="IMG-20260730-WA0000.jpg" class="photo">


<h1>
I'm Sorry Hiral ❤️
</h1>



<div class="message-area">


<p id="messageText"></p>


<button id="nextBtn" onclick="nextMessage()">
Next ❤️
</button>


</div>



<!-- Final Question -->


<div class="forgive" id="forgive">


<h2>
Will you forgive me? 🥺
</h2>


<button class="yes" onclick="yesClick()">
🥹 Yes ❤️
</button>


<button class="no" id="noBtn" onclick="noClick()">
🥺 No
</button>


</div>




</div>




<!-- Celebration -->

<div class="celebration" id="celebration">


<h1>
Thank you for forgiving me, Hirruuuuu ❤️
</h1>


</div>



<script src="script.js"></script>


</body>

</html>
