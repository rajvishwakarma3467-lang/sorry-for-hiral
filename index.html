<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hirruuuuu ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="particles"></div>

<!-- ========================= -->
<!-- SCREEN 1 -->
<!-- ========================= -->

<section id="screen1" class="screen active">

<div class="intro-box">

<h2>
❤️ Raj has something to say...
</h2>

<div class="envelope">

<div class="envelope-back"></div>

<div class="envelope-letter"></div>

<div class="envelope-flap"></div>

</div>

<h1>
A Letter For Hirruuuuu 💌
</h1>

<button id="openBtn">
Open My Heart ❤️
</button>

</div>

</section>
<!-- ========================= -->
<!-- SCREEN 2 -->
<!-- ========================= -->

<section id="screen2" class="screen">

<div class="letter-container">

<div id="letterPaper" class="paper">

<div class="photo-box">

<img src="IMG-20260730-WA0000.jpg" alt="Raj & Hirruuuuu" class="photo">

</div>

<h1 class="letter-title">
For My Hirruuuuu ❤️
</h1>

<div id="messageArea">

<p id="typedMessage"></p>

</div>

<div class="progress">

<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

<button id="nextBtn">
Next ❤️
</button>

</div>

</div>

</section>

<!-- ========================= -->
<!-- SCREEN 3 -->
<!-- ========================= -->

<section id="screen3" class="screen">

<div class="question-box">

<h1>
Will you forgive me? 🥺
</h1>

<div class="btn-group">

<button id="yesBtn">
🥹 Yes ❤️
</button>

<button id="noBtn">
🥺 No
</button>

</div>

</div>

</section>
<!-- ========================= -->
<!-- SCREEN 4 -->
<!-- ========================= -->

<section id="screen4" class="screen">

<div class="celebration-box">

<div id="rain"></div>

<h1 id="thanksMessage">
Thank you for forgiving me, Hirruuuuu ❤️
</h1>

</div>

</section>

</body>

<script src="script.js"></script>

</html>
